on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install packages
      run: |
        pip install pyqt5 pandas openpyxl pyinstaller

    - name: Build EXE
      run: |
        pyinstaller --onefile --windowed --name "NexusAnalyzerPro" --hidden-import pandas --hidden-import openpyxl --hidden-import openpyxl.styles --hidden-import PyQt5 --hidden-import PyQt5.QtWidgets --hidden-import PyQt5.QtCore --hidden-import PyQt5.QtGui --clean --noconfirm nexus_pro_v8.py

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: NexusAnalyzerPro-Windows
        path: dist/NexusAnalyzerPro.exe
        retention-days: 30
